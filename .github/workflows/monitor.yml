name: Job Monitor

on:
  schedule:
    - cron: "7,27,47 * * * *"  # solo riserva: riavvia il ciclo se si è fermato
  workflow_dispatch:         # permette di avviarlo a mano dalla tab Actions
    inputs:
      test_notify:
        description: "Invia solo una notifica di prova"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write   # per riavviare il ciclo

concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub fa partire il cron solo ogni 2-7 ore: il job resta acceso ~5h20,
      # controlla ogni 10 minuti e poi riavvia se stesso.
      - name: Controlla nuove posizioni (ogni 10 minuti)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "job-monitor-bot@users.noreply.github.com"
          end=$((SECONDS + 320*60))
          while true; do
            python monitor.py ${{ inputs.test_notify && '--test-notify' || '' }} || echo "controllo fallito, riprovo al prossimo giro"
            git add seen_jobs.json
            git diff --cached --quiet || git commit -q -m "Aggiorna posizioni viste"
            git pull -q --rebase && git push -q || echo "push fallito"
            [ "${{ inputs.test_notify }}" = "true" ] && break
            [ $SECONDS -ge $end ] && break
            sleep 600
          done

      - name: Riavvia il ciclo
        if: ${{ !cancelled() && inputs.test_notify != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main -R ${{ github.repository }}
